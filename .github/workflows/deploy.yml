# Build the site and publish it to GitHub Pages on every push to kml.
#
# The result lands at https://meticuloustransformer.github.io/3dWebModules/
#
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".
# Without that the deploy step fails with "Pages is not enabled".

name: deploy

on:
  push:
    branches: [kml]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A newer push waits its turn rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Pages serves this repo from /3dWebModules/, so the build needs the prefix.
      # To reproduce this build locally: SITE_BASE=/3dWebModules/ npm run build
      - name: Build
        run: npm run build
        env:
          SITE_BASE: /3dWebModules/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
